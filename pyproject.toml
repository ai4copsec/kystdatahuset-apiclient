[build-system]
requires = ["setuptools >= 61.0.0",
    "wheel",
    "build",
    "sphinx"]

# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "kystdatahuset-apiclient"
dynamic = ["version"]
description = "Package to communicate with the kystdatahuset API"
license = { file="LICENSE" }
readme = "README.md"
keywords = ["open source intelligence", "REST API", "data processing"]
authors = [
    { name = "Thomas Roehr", email = "roehr@simula.no" },
]
requires-python = ">=3.10"

maintainers = [
    { name = "Thomas Roehr", email = "roehr@simula.no" },
]

classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
]

dependencies = [
    "numpy",
    "pandas",
    "platformdirs",
    "pyarrow",
    "pydantic",
    "pydantic-settings",
    "requests",
    "tqdm",
]

[project.urls]
homepage = "https://ai4copsec.github.io/kystdatahuset-apiclient"
documentation = "https://ai4copsec.github.io/kystdatahuset-apiclient"
repository = "https://github.com/ai4copsec/kystdatahuset-apiclient"

#[project.entry-points]

[project.optional-dependencies]
dp = [
    "damast"
]

dev = [
    "flake8-gl-codeclimate",
    "isort",
    "pre-commit",
    "pydot",
    "quartodoc",
    "griffe<2",
    "tox"
]

test = [
    "damast",
    "coverage",
    "pytest",
    "pytest-console-scripts",
    "pytest-cov",
    "pytest-timeout",
    "pydot",
    "tox"
]

[project.scripts]
kystdata = "kystdata.cli.main:run"

[tool.setuptools.dynamic]
version = {attr = "kystdata.version.__version__"}

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Disable to be able to debug in IDE
#addopts = "--cov --cov-report html:doc/ --cov-report term-missing"

[tool.coverage.run]
source = ["src"]

[tool.pylint]
max-line-length = 120
disable = [
    "C0103", # (invalid-name)
    #    "C0114", # (missing-module-docstring)
    #    "C0115", # (missing-class-docstring)
    #    "C0116", # (missing-function-docstring)
    #    "R0903", # (too-few-public-methods)
    #    "R0913", # (too-many-arguments)
    #    "W0105", # (pointless-string-statement)
]

[tool.isort]
multi_line_output = 8
