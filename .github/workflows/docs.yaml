name: docs

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv --quiet

      - uses: actions/cache@v6
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-docs-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-docs-${{ runner.os }}-

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Create lock file
        run: uv lock

      - name: Install documentation dependencies
        run: uv sync --extra dev --frozen --quiet

      - name: Build API reference
        run: uv run quartodoc build --config docs/_quarto.yml

      - name: Render documentation
        run: uv run quarto render docs

      - name: Upload rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: public-docs
          path: docs/_site
          retention-days: 30

      # https://quarto.org/docs/publishing/github-pages.html
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs/_site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}